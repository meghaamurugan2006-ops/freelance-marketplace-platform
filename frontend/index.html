function uid(prefix) {
  return (prefix || "id") + "_" + Math.random().toString(36).slice(2, 10);
}

function money(n) {
  return "₹" + Number(n || 0).toLocaleString("en-IN");
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}

function timeAgo(iso) {
  const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (secs < 60) return "just now";
  const mins = Math.floor(secs / 60);
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + "d ago";
  return fmtDate(iso);
}

function initials(name) {
  if (!name) return "?";
  const parts = name.trim().split(/\s+/);
  const first = parts[0] ? parts[0][0] : "";
  const last = parts.length > 1 ? parts[parts.length - 1][0] : "";
  return (first + last).toUpperCase();
}

const AVATAR_PALETTE = ["#B8863B", "#2B6E64", "#8C5A8C", "#3E6FA8", "#B8452F", "#5B6270"];
function avatarColor(seed) {
  let h = 0;
  for (let i = 0; i < (seed || "").length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function save(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

const AppCtx = createContext(null);
function useApp() {
  return useContext(AppCtx);
}

function useHashRoute() {
  const parse = () => {
    const raw = window.location.hash.replace(/^#\/?/, "");
    const parts = raw.split("/").filter(Boolean);
    return { name: parts[0] || "home", param: parts[1] || null };
  };
  const [route, setRoute] = useState(parse());
  useEffect(() => {
    const onChange = () => setRoute(parse());
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  return route;
}

function navigate(path) {
  window.location.hash = "#/" + path;
  window.scrollTo(0, 0);
}

function Avatar({ name, size }) {
  const s = size || 36;
  return (
    <div
      className="gw-avatar"
      style={{
        width: s, height: s, borderRadius: "50%",
        background: avatarColor(name || ""),
        fontSize: Math.max(11, s * 0.38),
      }}
    >
      {initials(name)}
    </div>
  );
}

function Seal({ tone, children }) {
  return <span className={"gw-seal gw-seal--" + (tone || "neutral")}>{children}</span>;
}

function statusSeal(status) {
  const map = {
    open: { tone: "brass", label: "Open" },
    in_progress: { tone: "teal", label: "In progress" },
    delivered: { tone: "amber", label: "Delivered" },
    completed: { tone: "teal", label: "Completed" },
  };
  const s = map[status] || { tone: "neutral", label: status };
  return <Seal tone={s.tone}>{s.label}</Seal>;
}

function StarRating({ value, onChange, size }) {
  const stars = [1, 2, 3, 4, 5];
  return (
    <div className="gw-stars" style={{ fontSize: size || 18 }}>
      {stars.map((n) => (
        <span
          key={n}
          className={"gw-star" + (n <= value ? " gw-star--on" : "")}
          onClick={onChange ? () => onChange(n) : undefined}
          style={{ cursor: onChange ? "pointer" : "default" }}
        >
          ★
        </span>
      ))}
    </div>
  );
}

function AvgRating({ userId, reviews }) {
  const mine = reviews.filter((r) => r.toId === userId);
  if (mine.length === 0) return <span className="gw-muted">No reviews yet</span>;
  const avg = mine.reduce((a, r) => a + r.rating, 0) / mine.length;
  return (
    <span className="gw-rating-inline">
      <StarRating value={Math.round(avg)} size={14} />
      <span className="gw-muted"> {avg.toFixed(1)} ({mine.length})</span>
    </span>
  );
}

function EmptyState({ title, body, action }) {
  return (
    <div className="gw-empty">
      <div className="gw-empty__mark">◇</div>
      <h3>{title}</h3>
      <p>{body}</p>
      {action}
    </div>
  );
}

function TagInput({ value, onChange, placeholder }) {
  const [draft, setDraft] = useState("");
  function addTag() {
    const t = draft.trim();
    if (t && !value.includes(t)) onChange([...value, t]);
    setDraft("");
  }
  return (
    <div className="gw-taginput">
      {value.map((t) => (
        <span className="gw-tag" key={t}>
          {t}
          <button type="button" onClick={() => onChange(value.filter((x) => x !== t))}>×</button>
        </span>
      ))}
      <input
        value={draft}
        placeholder={placeholder || "Add a skill and press Enter"}
        onChange={(e) => setDraft(e.target.value)}
        onKeyDown={(e) => {
          if (e.key === "Enter" || e.key === ",") {
            e.preventDefault();
            addTag();
          }
        }}
        onBlur={addTag}
      />
    </div>
  );
}

function Toasts({ toasts }) {
  return (
    <div className="gw-toasts">
      {toasts.map((t) => (
        <div key={t.id} className={"gw-toast gw-toast--" + (t.tone || "ink")}>
          {t.text}
        </div>
      ))}
    </div>
  );
}

function Login() {

  const [email, setEmail] = useState("");

  const [error, setError] = useState("");

  function submit(e) {
    e.preventDefault();
    const res = login(email.trim().toLowerCase(), password);
    if (!res.ok) {
      setError(res.error);
      return;
    }
    navigate("dashboard");
  }

  function demo(role) {
    const creds = role === "client" ? { email: "ananya@brightloom.studio", password: "demo1234" } : { email: "meera@example.com", password: "demo1234" };

  return (
    <AuthShell title="Welcome back" sub="Log in to manage your projects, bids, and escrow.">
      <form onSubmit={submit} className="gw-form">
        <label>Email

        </label>
        <label>Password
          <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" />

    const res = signup({ role, name: name.trim(), email: email.trim().toLowerCase(), password, skills });
    if (!res.ok) {
      setError(res.error);
      return;
    }
    navigate("dashboard");
  }

  return (
    <AuthShell title="Join the guild" sub="Set up an account as a client posting work, or a freelancer looking for it.">
      <form onSubmit={submit} className="gw-form">
        <div className="gw-roletoggle">
          <button type="button" className={role === "client" ? "gw-roletoggle__btn gw-roletoggle__btn--active" : "gw-roletoggle__btn"} onClick={() => setRole("client")}>I'm hiring</button>
          <button type="button" className={role === "freelancer" ? "gw-roletoggle__btn gw-roletoggle__btn--active" : "gw-roletoggle__btn"} onClick={() => setRole("freelancer")}>I'm freelancing</button>
        </div>
        <label>Full name
          <input required value={name} onChange={(e) => setName(e.target.value)} placeholder="Your name" />
        </label>
        <label>Email
          <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" />
        </label>
        <label>Password
          <input type="password" required minLength={4} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="At least 4 characters" />
        </label>
        {role === "freelancer" && (
          <label>Skills
            <TagInput value={skills} onChange={setSkills} placeholder="e.g. React, then press Enter" />
          </label>
        )}
        {error && <p className="gw-error">{error}</p>}
        <button type="submit" className="gw-btn gw-btn--brass gw-btn--block">Create account</button>
      </form>
      <p className="gw-muted gw-authcard__foot">Already have an account? <a href="#/login">Log in</a></p>
    </AuthShell>
  );
}

function BrowseProjects() {
  const { data, session } = useApp();
  const [q, setQ] = useState("");
  const [skill, setSkill] = useState("all");

  const allSkills = useMemo(() => {
    const set = new Set();
    data.projects.forEach((p) => p.skills.forEach((s) => set.add(s)));
    return Array.from(set).sort();
  }, [data.projects]);

  const results = data.projects.filter((p) => {
    if (p.status !== "open") return false;
    if (skill !== "all" && !p.skills.includes(skill)) return false;
    if (q && !(p.title + " " + p.description).toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });

  return (
    <div className="gw-main">
      <div className="gw-pageheader">
        <div>
          <h1>Open work on the board</h1>
          <p className="gw-muted">{results.length} project{results.length === 1 ? "" : "s"} looking for a freelancer right now.</p>
        </div>
      </div>

      <div className="gw-filterbar">
        <input placeholder="Search by title or keyword" value={q} onChange={(e) => setQ(e.target.value)} />
        <select value={skill} onChange={(e) => setSkill(e.target.value)}>
          <option value="all">All skills</option>
          {allSkills.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      {results.length === 0 ? (
        <EmptyState title="No matching projects" body="Try a different keyword or clear the skill filter." />
      ) : (
        <div className="gw-ledgerlist">
          {results.map((p) => {
            const client = data.users.find((u) => u.id === p.clientId);
            const alreadyBid = session.role === "freelancer" && data.bids.some((b) => b.projectId === p.id && b.freelancerId === session.id);
            return (
              <a href={"#/project/" + p.id} key={p.id} className="gw-ledgerrow gw-ledgerrow--tall">
                <div className="gw-ledgerrow__main">
                  <span className="gw-ledgerrow__title">{p.title}</span>
                  <p className="gw-muted gw-clamp2">{p.description}</p>
                  <div className="gw-chiprow">
                    {p.skills.map((s) => <span className="gw-chip" key={s}>{s}</span>)}
                  </div>
                  <span className="gw-muted">Posted by {client ? client.name : "a client"} · {timeAgo(p.createdAt)}</span>
                </div>
                <div className="gw-ledgerrow__side">
                  <span className="gw-ledgerrow__budget">{money(p.budget)}</span>
                  <span className="gw-muted">{data.bids.filter((b) => b.projectId === p.id).length} proposals</span>
                  {alreadyBid && <Seal tone="teal">Proposal sent</Seal>}
                </div>
              </a>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PostProject() {
  const { session, addProject, toast } = useApp();
  const [title, setTitle] = useState("");
  const [description, setDescription] = useState("");
  const [skills, setSkills] = useState([]);
  const [budget, setBudget] = useState("");
  const [deadline, setDeadline] = useState("");
  const [error, setError] = useState("");

  function submit(e) {
    e.preventDefault();
    if (!title.trim() || !description.trim() || !budget || !deadline) {
      setError("Please fill in every field before posting.");
      return;
    }
    const project = addProject({
      clientId: session.id,
      title: title.trim(),
      description: description.trim(),
      skills,
      budget: Number(budget),
      deadline: new Date(deadline).toISOString(),
    });
    toast("Project posted to the board.", "teal");
    navigate("project/" + project.id);
  }

  return (
    <div className="gw-main gw-main--narrow">
      <div className="gw-pageheader">
        <div>
          <h1>Post a project</h1>
          <p className="gw-muted">Describe the work clearly — the right freelancers respond faster to specific briefs.</p>
        </div>
      </div>
      <form onSubmit={submit} className="gw-form gw-card">
        <label>Title
          <input required value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Redesign our checkout flow" />
        </label>
        <label>Description
          <textarea required rows={6} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What needs to be done, and what does 'finished' look like?" />
        </label>
        <label>Skills needed
          <TagInput value={skills} onChange={setSkills} />
        </label>
        <div className="gw-form__row">
          <label>Budget (₹)
            <input required type="number" min="1" value={budget} onChange={(e) => setBudget(e.target.value)} placeholder="30000" />
          </label>
          <label>Deadline
            <input required type="date" value={deadline} onChange={(e) => setDeadline(e.target.value)} />
          </label>
        </div>
        {error && <p className="gw-error">{error}</p>}
        <button type="submit" className="gw-btn gw-btn--brass gw-btn--block">Post to the board</button>
      </form>
    </div>
  );
}

function ProjectDetails({ id }) {
  const { session, data, addBid, acceptBid, markDelivered, releaseEscrow, addReview, toast } = useApp();
  const project = data.projects.find((p) => p.id === id);
  const [bidAmount, setBidAmount] = useState("");
  const [bidMessage, setBidMessage] = useState("");
  const [reviewRating, setReviewRating] = useState(5);
  const [reviewComment, setReviewComment] = useState("");

  if (!project) {
    return (
      <div className="gw-main">
        <EmptyState title="Project not found" body="It may have been removed." action={<a href="#/browse" className="gw-btn gw-btn--brass">Back to the board</a>} />
      </div>
    );
  }

  const client = data.users.find((u) => u.id === project.clientId);
  const freelancer = data.users.find((u) => u.id === project.selectedFreelancerId);
  const projectBids = data.bids.filter((b) => b.projectId === project.id);
  const myBid = session.role === "freelancer" ? projectBids.find((b) => b.freelancerId === session.id) : null;
  const isOwner = session.role === "client" && session.id === project.clientId;
  const isAssignedFreelancer = session.role === "freelancer" && session.id === project.selectedFreelancerId;
  const escrowEntry = data.escrow.find((e) => e.projectId === project.id);
  const alreadyReviewed = data.reviews.some((r) => r.projectId === project.id && r.fromId === session.id);

  function submitBid(e) {
    e.preventDefault();
    if (!bidAmount) return;
    addBid({ projectId: project.id, freelancerId: session.id, amount: Number(bidAmount), message: bidMessage.trim() });
    toast("Proposal sent.", "teal");
    setBidAmount("");
    setBidMessage("");
  }

  function submitReview(e) {
    e.preventDefault();
    const toId = session.role === "client" ? project.selectedFreelancerId : project.clientId;
    addReview({ projectId: project.id, fromId: session.id, toId, rating: reviewRating, comment: reviewComment.trim() });
    toast("Review posted.", "teal");
    setReviewComment("");
  }

  return (
    <div className="gw-main gw-main--narrow">
      <div className="gw-pageheader">
        <div>
          {statusSeal(project.status)}
          <h1>{project.title}</h1>
          <p className="gw-muted">Posted by {client ? client.name : "a client"} · {timeAgo(project.createdAt)} · deadline {fmtDate(project.deadline)}</p>
        </div>
        <div className="gw-project__budget">{money(project.budget)}</div>
      </div>

      <div className="gw-card">
        <p>{project.description}</p>
        <div className="gw-chiprow">
          {project.skills.map((s) => <span className="gw-chip" key={s}>{s}</span>)}
        </div>
      </div>

      {freelancer && (
        <div className="gw-card gw-card--row">
          <Avatar name={freelancer.name} size={40} />
          <div>
            <div className="gw-ledgerrow__title">{freelancer.name} is working on this</div>
            <AvgRating userId={freelancer.id} reviews={data.reviews} />
          </div>
          <a href="#/messages" className="gw-btn gw-btn--ghost">Open thread</a>
        </div>
      )}

      {escrowEntry && (
        <div className="gw-card gw-card--row">
          <Seal tone={escrowEntry.status === "held" ? "teal" : "brass"}>{escrowEntry.status === "held" ? "Escrow secured" : "Funds released"}</Seal>
          <div>
            <div className="gw-ledgerrow__title">{money(escrowEntry.amount)} {escrowEntry.status === "held" ? "held" : "released"}</div>
            <span className="gw-muted">Funded {timeAgo(escrowEntry.createdAt)}</span>
          </div>
          <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
            {isAssignedFreelancer && project.status === "in_progress" && (
              <button className="gw-btn gw-btn--brass" onClick={() => { markDelivered(project.id); toast("Marked as delivered — waiting on client review."); }}>Mark work delivered</button>
            )}
            {isOwner && project.status === "delivered" && escrowEntry.status === "held" && (
              <button className="gw-btn gw-btn--brass" onClick={() => { releaseEscrow(project.id); toast("Funds released to freelancer.", "teal"); }}>Release funds</button>
            )}
          </div>
        </div>
      )}

      {session.role === "freelancer" && project.status === "open" && !myBid && (
        <div className="gw-card">
          <h3 className="gw-subhead gw-subhead--tight">Send a proposal</h3>
          <form onSubmit={submitBid} className="gw-form">
            <label>Your bid (₹)
              <input required type="number" min="1" value={bidAmount} onChange={(e) => setBidAmount(e.target.value)} placeholder={String(project.budget)} />
            </label>
            <label>Note to the client
              <textarea rows={4} value={bidMessage} onChange={(e) => setBidMessage(e.target.value)} placeholder="Why you're a good fit, and how you'd approach it." />
            </label>
            <button type="submit" className="gw-btn gw-btn--brass gw-btn--block">Send proposal</button>
          </form>
        </div>
      )}

      {myBid && (
        <div className="gw-card gw-card--row">
          <Seal tone={myBid.status === "accepted" ? "teal" : myBid.status === "rejected" ? "rust" : "neutral"}>
            {myBid.status === "pending" ? "Awaiting reply" : myBid.status === "accepted" ? "Accepted" : "Not selected"}
          </Seal>
          <div>
            <div className="gw-ledgerrow__title">You bid {money(myBid.amount)}</div>
            <span className="gw-muted">{myBid.message}</span>
          </div>
        </div>
      )}

      {isOwner && project.status === "open" && (
        <div>
          <h3 className="gw-subhead">Proposals received</h3>
          {projectBids.length === 0 ? (
            <EmptyState title="No proposals yet" body="Sit tight — proposals will show up here as freelancers apply." />
          ) : (
            <div className="gw-ledgerlist">
              {projectBids.map((b) => {
                const f = data.users.find((u) => u.id === b.freelancerId);
                return (
                  <div className="gw-ledgerrow gw-ledgerrow--tall" key={b.id}>
                    <div className="gw-ledgerrow__main">
                      <div className="gw-card--row" style={{ padding: 0, border: "none" }}>
                        <Avatar name={f ? f.name : "?"} size={32} />
                        <span className="gw-ledgerrow__title">{f ? f.name : "Unknown"}</span>
                        <AvgRating userId={b.freelancerId} reviews={data.reviews} />
                      </div>
                      <p className="gw-muted">{b.message}</p>
                    </div>
                    <div className="gw-ledgerrow__side">
                      <span className="gw-ledgerrow__budget">{money(b.amount)}</span>
                      <button className="gw-btn gw-btn--brass" onClick={() => { acceptBid(b.id); toast("Proposal accepted — funds moved to escrow.", "teal"); }}>
                        Accept &amp; fund escrow
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {project.status === "completed" && !alreadyReviewed && (isOwner || isAssignedFreelancer) && (
        <div className="gw-card">
          <h3 className="gw-subhead gw-subhead--tight">Leave a review</h3>
          <form onSubmit={submitReview} className="gw-form">
            <StarRating value={reviewRating} onChange={setReviewRating} size={24} />
            <textarea rows={3} value={reviewComment} onChange={(e) => setReviewComment(e.target.value)} placeholder="How did it go?" />
            <button type="submit" className="gw-btn gw-btn--brass">Post review</button>
          </form>
        </div>
      )}
    </div>
  );
}

/* Messages                                                            */

function Messages() {
  const { session, data, sendMessage } = useApp();
  const myProjects = data.projects.filter((p) => p.selectedFreelancerId && (p.clientId === session.id || p.selectedFreelancerId === session.id));
  const [activeId, setActiveId] = useState(myProjects[0] ? myProjects[0].id : null);
  const [draft, setDraft] = useState("");
  const active = myProjects.find((p) => p.id === activeId);
  const thread = active ? data.messages.filter((m) => m.projectId === active.id).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt)) : [];
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [thread.length, activeId]);

  function otherParty(p) {
    const otherId = session.role === "client" ? p.selectedFreelancerId : p.clientId;
    return data.users.find((u) => u.id === otherId);
  }

  function submit(e) {
    e.preventDefault();
    if (!draft.trim() || !active) return;
    sendMessage({ projectId: active.id, senderId: session.id, text: draft.trim() });
    setDraft("");
  }

  return (
    <div className="gw-main gw-main--flush">
      <div className="gw-messages">
        <div className="gw-messages__list">
          <h2 className="gw-messages__heading">Conversations</h2>
          {myProjects.length === 0 && <p className="gw-muted" style={{ padding: "0 20px" }}>No active conversations yet — they start once a proposal is accepted.</p>}
          {myProjects.map((p) => {
            const other = otherParty(p);
            const lastMsg = data.messages.filter((m) => m.projectId === p.id).slice(-1)[0];
            return (
              <button key={p.id} className={"gw-convo" + (p.id === activeId ? " gw-convo--active" : "")} onClick={() => setActiveId(p.id)}>
                <Avatar name={other ? other.name : "?"} size={38} />
                <div className="gw-convo__body">
                  <div className="gw-convo__name">{other ? other.name : "Unknown"}</div>
                  <div className="gw-convo__project">{p.title}</div>
                  {lastMsg && <div className="gw-convo__preview">{lastMsg.text}</div>}
                </div>
              </button>
            );
          })}
        </div>
        <div className="gw-messages__thread">
          {active ? (
            <>
              <div className="gw-messages__threadhead">
                <Avatar name={otherParty(active) ? otherParty(active).name : "?"} size={34} />
                <div>
                  <div className="gw-convo__name">{otherParty(active) ? otherParty(active).name : "Unknown"}</div>
                  <div className="gw-convo__project">{active.title}</div>
                </div>
              </div>
              <div className="gw-messages__body" ref={scrollRef}>
                {thread.map((m) => (
                  <div key={m.id} className={"gw-bubblerow" + (m.senderId === session.id ? " gw-bubblerow--mine" : "")}>
                    <div className="gw-bubble">
                      <div>{m.text}</div>
                      <div className="gw-bubble__time">{timeAgo(m.createdAt)}</div>
                    </div>
                  </div>
                ))}
              </div>
              <form className="gw-messages__composer" onSubmit={submit}>
                <input value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="Write a message…" />
                <button type="submit" className="gw-btn gw-btn--brass">Send</button>
              </form>
            </>
          ) : (
            <EmptyState title="Select a conversation" body="Messages tied to your active projects will appear here." />
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Escrow                                                              */
/* ---------------------------------------------------------------- */

function Escrow() {
  const { session, data, markDelivered, releaseEscrow, toast } = useApp();
  const relevant = data.projects.filter((p) => (session.role === "client" ? p.clientId === session.id : p.selectedFreelancerId === session.id) && p.selectedFreelancerId);

  return (
    <div className="gw-main">
      <div className="gw-pageheader">
        <div>
          <h1>Escrow</h1>
          <p className="gw-muted">Every funded project and where its payment currently stands.</p>
        </div>
      </div>
      {relevant.length === 0 ? (
        <EmptyState title="Nothing in escrow yet" body="Escrow entries appear once a proposal is accepted and funded." />
      ) : (
        <div className="gw-ledgerlist">
          {relevant.map((p) => {
            const e = data.escrow.find((x) => x.projectId === p.id);
            if (!e) return null;
            const other = data.users.find((u) => u.id === (session.role === "client" ? p.selectedFreelancerId : p.clientId));
            return (
              <div key={p.id} className="gw-ledgerrow gw-ledgerrow--tall">
                <div className="gw-ledgerrow__main">
                  <a href={"#/project/" + p.id} className="gw-ledgerrow__title">{p.title}</a>
                  <span className="gw-muted">With {other ? other.name : "—"} · funded {timeAgo(e.createdAt)}</span>
                </div>
                <div className="gw-ledgerrow__side">
                  <span className="gw-ledgerrow__budget">{money(e.amount)}</span>
                  <Seal tone={e.status === "held" ? "teal" : "brass"}>{e.status === "held" ? "Held" : "Released"}</Seal>
                  {session.role === "freelancer" && p.status === "in_progress" && (
                    <button className="gw-btn gw-btn--ghost" onClick={() => { markDelivered(p.id); toast("Marked as delivered."); }}>Mark delivered</button>
                  )}
                  {session.role === "client" && p.status === "delivered" && e.status === "held" && (
                    <button className="gw-btn gw-btn--brass" onClick={() => { releaseEscrow(p.id); toast("Funds released.", "teal"); }}>Release funds</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Profile                                                             */
/* ---------------------------------------------------------------- */

function Profile() {
  const { session, data, updateProfile, toast } = useApp();
  const [bio, setBio] = useState(session.bio || "");
  const [skills, setSkills] = useState(session.skills || []);
  const [rate, setRate] = useState(session.rate || "");
  const myReviews = data.reviews.filter((r) => r.toId === session.id);

  function submit(e) {
    e.preventDefault();
    updateProfile({ bio: bio.trim(), skills, rate: rate ? Number(rate) : null });
    toast("Profile updated.", "teal");
  }

  return (
    <div className="gw-main gw-main--narrow">
      <div className="gw-pageheader">
        <div className="gw-card--row" style={{ padding: 0, border: "none" }}>
          <Avatar name={session.name} size={56} />
          <div>
            <h1 style={{ margin: 0 }}>{session.name}</h1>
            <AvgRating userId={session.id} reviews={data.reviews} />
          </div>
        </div>
      </div>

      <form onSubmit={submit} className="gw-form gw-card">
        <label>About
          <textarea rows={4} value={bio} onChange={(e) => setBio(e.target.value)} placeholder="Tell clients or freelancers what you do." />
        </label>
        {session.role === "freelancer" && (
          <>
            <label>Skills
              <TagInput value={skills} onChange={setSkills} />
            </label>
            <label>Rate (₹ per hour, optional)
              <input type="number" min="0" value={rate} onChange={(e) => setRate(e.target.value)} />
            </label>
          </>
        )}
        <button type="submit" className="gw-btn gw-btn--brass">Save changes</button>
      </form>

      <h3 className="gw-subhead">Reviews received</h3>
      {myReviews.length === 0 ? (
        <EmptyState title="No reviews yet" body="Reviews appear here once a project is completed." />
      ) : (
        <div className="gw-ledgerlist">
          {myReviews.map((r) => {
            const from = data.users.find((u) => u.id === r.fromId);
            const proj = data.projects.find((p) => p.id === r.projectId);
            return (
              <div key={r.id} className="gw-ledgerrow gw-ledgerrow--tall">
                <div className="gw-ledgerrow__main">
                  <div className="gw-card--row" style={{ padding: 0, border: "none" }}>
                    <Avatar name={from ? from.name : "?"} size={30} />
                    <span className="gw-ledgerrow__title">{from ? from.name : "Someone"}</span>
                    <StarRating value={r.rating} size={14} />
                  </div>
                  <p className="gw-muted">{r.comment}</p>
                  {proj && <span className="gw-muted">On “{proj.title}”</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Root app                                                            */
/* ---------------------------------------------------------------- */

function AppShellRouted({ route }) {
  const page = (() => {
    switch (route.name) {
      case "dashboard": return <Dashboard />;
      case "browse": return <BrowseProjects />;
      case "post": return <PostProject />;
      case "project": return <ProjectDetails id={route.param} />;
      case "messages": return <Messages />;
      case "escrow": return <Escrow />;
      case "profile": return <Profile />;
      default: return <Dashboard />;
    }
  })();
  return (
    <div className="gw-appshell">
      <Sidebar route={route} />
      <div className="gw-appshell__content">{page}</div>
    </div>
  );
}

function Root() {
  const route = useHashRoute();
  const [session, setSession] = useState(() => load(DB_KEYS.session, null));
  const [data, setData] = useState(() => ({
    users: load(DB_KEYS.users, []),
    projects: load(DB_KEYS.projects, []),
    bids: load(DB_KEYS.bids, []),
    messages: load(DB_KEYS.messages, []),
    escrow: load(DB_KEYS.escrow, []),
    reviews: load(DB_KEYS.reviews, []),
  }));
  const [toasts, setToasts] = useState([]);

  function toast(text, tone) {
    const id = uid("toast");
    setToasts((t) => [...t, { id, text, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }

  function persist(next) {
    setData(next);
    save(DB_KEYS.users, next.users);
    save(DB_KEYS.projects, next.projects);
    save(DB_KEYS.bids, next.bids);
    save(DB_KEYS.messages, next.messages);
    save(DB_KEYS.escrow, next.escrow);
    save(DB_KEYS.reviews, next.reviews);
  }

  function login(email, password) {
    const user = data.users.find((u) => u.email === email);
    if (!user || user.password !== password) return { ok: false, error: "That email and password combination doesn't match our records." };
    setSession(user);
    save(DB_KEYS.session, user);
    return { ok: true };
  }

  function signup({ role, name, email, password, skills }) {
    if (!name || !email || !password) return { ok: false, error: "Please fill in every field." };
    if (data.users.some((u) => u.email === email)) return { ok: false, error: "An account with that email already exists." };
    const user = { id: uid("u"), name, email, password, role, company: "", bio: "", skills: skills || [], rate: null, createdAt: new Date().toISOString() };
    const next = { ...data, users: [...data.users, user] };
    persist(next);
    setSession(user);
    save(DB_KEYS.session, user);
    return { ok: true };
  }

  function logout() {
    setSession(null);
    localStorage.removeItem(DB_KEYS.session);
    navigate("");
  }

  function addProject(fields) {
    const project = { id: uid("p"), status: "open", selectedFreelancerId: null, createdAt: new Date().toISOString(), ...fields };
    persist({ ...data, projects: [project, ...data.projects] });
    return project;
  }

  function addBid(fields) {
    const bid = { id: uid("b"), status: "pending", createdAt: new Date().toISOString(), ...fields };
    persist({ ...data, bids: [...data.bids, bid] });
    return bid;
  }

  function acceptBid(bidId) {
    const bid = data.bids.find((b) => b.id === bidId);
    if (!bid) return;
    const bids = data.bids.map((b) => {
      if (b.id === bidId) return { ...b, status: "accepted" };
      if (b.projectId === bid.projectId) return { ...b, status: "rejected" };
      return b;
    });
    const projects = data.projects.map((p) => p.id === bid.projectId ? { ...p, status: "in_progress", selectedFreelancerId: bid.freelancerId } : p);
    const escrow = [...data.escrow, { id: uid("e"), projectId: bid.projectId, amount: bid.amount, status: "held", createdAt: new Date().toISOString() }];
    const project = projects.find((p) => p.id === bid.projectId);
    const messages = [...data.messages, { id: uid("m"), projectId: bid.projectId, senderId: project.clientId, text: "Looking forward to working together on this — let me know if you need anything to get started.", createdAt: new Date().toISOString() }];
    persist({ ...data, bids, projects, escrow, messages });
  }

  function markDelivered(projectId) {
    persist({ ...data, projects: data.projects.map((p) => p.id === projectId ? { ...p, status: "delivered" } : p) });
  }

  function releaseEscrow(projectId) {
    const projects = data.projects.map((p) => p.id === projectId ? { ...p, status: "completed" } : p);
    const escrow = data.escrow.map((e) => e.projectId === projectId ? { ...e, status: "released" } : e);
    persist({ ...data, projects, escrow });
  }

  function addReview(fields) {
    const review = { id: uid("r"), createdAt: new Date().toISOString(), ...fields };
    persist({ ...data, reviews: [...data.reviews, review] });
  }

  function sendMessage(fields) {
    const message = { id: uid("m"), createdAt: new Date().toISOString(), ...fields };
    persist({ ...data, messages: [...data.messages, message] });
  }

  function updateProfile(fields) {
    const users = data.users.map((u) => u.id === session.id ? { ...u, ...fields } : u);
    persist({ ...data, users });
    const updated = { ...session, ...fields };
    setSession(updated);
    save(DB_KEYS.session, updated);
  }

  const ctxValue = {
    session, data, login, signup, logout,
    addProject, addBid, acceptBid, markDelivered, releaseEscrow, addReview, sendMessage, updateProfile,
    toast,
  };

  const publicRoutes = ["home", "login", "signup"];
  let body;
  if (!session && !publicRoutes.includes(route.name)) {
    body = <Login />;
  } else if (session && publicRoutes.includes(route.name) && route.name !== "home") {
    body = <AppShellRouted route={{ name: "dashboard" }} />;
  } else if (route.name === "home") {
    body = <Landing />;
  } else if (route.name === "login") {
    body = <Login />;
  } else if (route.name === "signup") {
    body = <Signup />;
  } else {
    body = <AppShellRouted route={route} />;
  }

  return (
    <AppCtx.Provider value={ctxValue}>
      {body}
      <Toasts toasts={toasts} />
    </AppCtx.Provider>
  );
}

seedIfNeeded();
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);
</script>
</body>
